front:
  text: 衡山和尚語録序昔達磨西來不立文字直指人心見性成佛後六祖曰達磨道箇直指早是曲了也何以故要知不立二字亦是文字且達磨傳法偈四句豈非文字乎其不尚文字者恐人滯指而迷月也又太原孚因雪峰道一隻聖箭直射九重城裏去也遂趁至中路勘神晏國師回謂雪峰曰好隻聖箭中路折卻了也遂舉前話峰曰奴渠語在由此觀之文字語言其可無乎衡山和尚聚雲之孫治平之子出住吉祥龍象雲集其機鋒似金刀破竹其才辨若珠子走盤其上堂小參法語皆從胸襟流出蓋天蓋地真不愧為大慧之兒孫也夫聚雲治平諸大老重振大慧之道於西蜀而衡山三山諸和尚又能繼志述事俾雙徑禪燈旦復旦兮則凡我濟北後裔皆當共慶同宗之盛也茲普陀別菴和尚以衡山令伯語録壽諸棗梨而几幻大師索序於豫豫不自揣援筆作此何異捧土培泰山掬水沃東海哉康熙乙亥王春龍池後裔閩莆超原淡崖氏拜撰慶雲炳禪師語録序臨濟之道騰越而起類皆岷蜀之人五祖昭覺其最著者逮有明神宗朝雲老人以間世英偉承徑山之後大乃父乃祖之庭于桐山王壘光焰赫奕諸方傾向以為臨濟再興故出其門者廣大精微凌轢前古直與南匾頭寶峰文輩並驅中原歟盛哉慶忠禪師居其一也忠得法龍象二十三人三座則為慶雲炳禪師按炳狀師少即見先聚雲于寶峰初入侍寮不幾于度水擎茶間已明己躬下事雲歿後始親忠于枳江久之克第一座當是時也巴蜀禪叢肇啓遐邇英俊雲委川輪師以妙齡首衆舉揚從上巴鼻明清以來馳聲走譽弘揚徑山聚雲之道者皆自痛拳辣手出焉且師之碩德行業冰清玉潤去住翛然臨死生之際獲大無畏如獅子王遊戲自在非近世楊鄭所企及者不佞仰之深慕之久矣師凡兩坐道場晚興慶雲語録一卷皆膾炙叢林服膺緇素顧其言雖不多要皆到地本草如人食少金剛自當穿皮而出非過量人難為湊泊者普陀別菴禪師師之猶子也當童稚時撫其臂曰異時弘我徑山之道者舍子而誰師滅去十餘年別公果法道大震東南抑見師之慧鑑不爽矣今其三世孫几幻禪人持稿南來謀豫不佞辨言簡端又以別公之介紹請陳始末乃退而為之書康熙丙子孟春月上浣鎮守浙江等處地方定海總兵官左都督藍理拜撰
