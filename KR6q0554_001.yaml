body:
  text: 法孫宗位編順治壬辰七月望日夔州府石砫祇園檀越蘇茂宇暨衆善信請師住吉祥禪寺入院三門如來倒駕逆來菩薩順行而去雖然來去不同縱橫上下無忌還識路頭麼十方薄伽梵一路涅槃門卓拄杖便入伽藍紅髮白牙鐵臉爛額應現圓通出沒莫測箇箇恆衛吉祥只教眉毛出血如斯依教奉行不負山僧饒舌珍重珍重方丈不喚作方丈玄要難分喚作方丈照用齊立有時驅耕夫之牛奪饑人之食末後轉身異類行縱橫百寸是十尺喝一喝云料揀齊施賓主全百億金毛出隊躑即日迎佛升座請上堂師拈香祝聖畢次拈云此瓣香荊棘叢中常快活干戈林裏恆吉祥即今對人天衆前信手拈來供養傳臨濟正宗第二十六世現住慶忠堂上上鐵下壁本師老和尚用酬法乳之恩斂衣就座維那白槌云法筵龍象衆當觀第一義師舉趙州云有時將丈六金身作一莖草有時將一莖草作丈六金身建立也在我掃蕩也在我今日山僧則不恁麼有時將三世諸佛向吉祥寶殿裏安立有時將吉祥寶殿向三世諸佛眉毛上安立收來也在我放去也在我恁麼告報且道與趙州是同是別還見麼坐斷兩頭無別路一切時中最吉祥維那再白槌云諦觀法王法法王法如是師下座冉總戎利幽請上堂僧問此日拈花是錢索是井索師云野人恆面壁進云五福宏開時如何師云三星拱吉祥乃云六三六四六五吉祥大震法鼓黃梅三擊祖意幡花羅列飛舞今日乃冉公大護法建普利道場特請山僧升座舉揚般若若論般若無說無聞向何處開口只聽得有一尊宿在山僧拄杖頭上道大乘井索小乘錢索有漏笊籬無漏木杓撞著臨濟德山無故入門便棒便喝差甚麼使者雲行功曹傳奏大地草木咸放光明天龍鬼神歡喜信受卓拄杖云知麼野人恆面壁三星拱吉祥佛誕日檀信啓華嚴會請上堂昔年今日四月八今日昔年四月八東西南北露全身四維上下天花撒吉祥院裏事不同僧俗乘時轉妙法若以白紙黑字為法猶是止啼黃蘗若以數墨等行為轉亦是門外之繞即今合作麼生又久云天上天下惟吾獨尊午日上堂菖蒲劍艾葉虎海底紅輪日當午吉祥漏逗者封皮聲聲震動龍舟鼓喝一喝云還聞麼順治丙申九月朔日總戎袁公大護法暨闔營將士請住忠州福城山慶雲禪寺上堂豎拄杖云天得一以清卓拄杖云地得一以寧橫擔拄杖云人得一以靈且道衲僧得一時又作麼生建法幢立宗旨人天號令南山雲北山雨虎嘯風生擲拄杖連喝三喝云十方聚會學無為選佛場開歸及第檀姓利幽請上堂生是死之生死是生之死兩路坦然平無彼亦無此會麼若也未會再與重下注腳以拂子打相云此是佛體性三昧世界也在此中衆生也在此中過去現在未來諸佛諸祖十聖三賢也在此中乃至六道遷徙四生升降抱恨含冤苦樂榮辱悔罪造業改過從新俱在此中所以世尊遣阿難尊者往地獄問提婆達多云汝在此中樂否提婆云如三禪天樂者云汝還求出否提婆云待世尊入地獄我才出地獄者云世尊豈有入地獄分提婆云世尊既無入地獄分我豈有出地獄分汝等若在者裏會得便向升沉遷徙處識取本地風光且道如何是本地風光復以拂子畫相云處處總成華藏界堂堂無處不毗盧說戒上堂舉拄杖云釋迦老子來也在山僧拄杖頭上道不用安排切莫造作安排造作無繩自縛不安排不造作善財彈指登樓閣祕魔放下手中叉普化入市搖鈴鐸諸仁者于斯薦得百千法門同歸方寸河沙妙德總在心源一切戒定慧門悉皆具足不離汝心如或未然鞭影日將調意馬溪光時把按心牛卓一卓慶忠老和尚設忌上堂拄杖突出虛空踢著通身粉碎三炮四喝料揀玄要賓主明歷此是老和尚家醜當陽露出端的作麼是露出底句咄明德居士請上堂踏破虛空口崑崙顛倒走明德出頭來性哲傳燈久以拄杖畫相云參聚雲三目法叔老和尚訃音至上堂同住聚雲時曾霑猶子愛離亂各一方面目無隔礙化緣事已周分身遍法界大衆還知者老漢落處麼遇寒湖中向火逢熱火裏乘涼恁麼本分自由好與頂門揭蓋復云蒼天蒼天上堂扇子𨁝跳上三十三天獅子窟中無異獸觸著帝釋鼻孔象王行處絶派蹤東海鯉魚打一棒萬里橫尸雨似盆傾四洲普潤大衆會麼福城批判異諸方大用全提只者是小參小參人天百萬驀然拈花此是瞿曇老漢上頭關喚作竹篦則觸不喚作竹篦則背此是徑山老漢上頭關一棒一條痕一摑一掌血此是慶忠老漢上頭關逢人便拜遇佛便打此是福城長老上頭關若在者裏一一會得縱然一夜風吹去只在蘆花淺水邊如或未然太湖三萬六千頃月在波心說向誰小參舉趙州和尚云老僧十二時中除粥飯二時是雜用心處此是古人為敵生死底工夫今人又當何如若要擔荷佛祖門庭須要箇直實決定志氣千磨萬鍊百棒打不回頭底漢子始得若是半疑半信半進半退底終是半途而廢安能在生死海中倒駕慈航耶久立衆慈各宜努力總戎袁寶善居士請小參舉僧問趙州如何是祖師西來意州云庭前柏樹子僧云和尚莫將境示人州云我不將境示人僧云如何是祖師西來意州云庭前柏樹子者箇公案要纍及寶善居士在示衆午日示衆石輥嚼破虛空冤屈崑崙叫苦痛殺海上王郎到處敲鑼動鼓喝一喝云家家蒲倚天寒報到今朝是端午示衆生從何處來死向何處去知得來去處方名學道人連喝四喝云會得老僧者四喝參學事畢如或未然但看受生死底是誰不受生死底是誰知得來去處底是誰不知來去處底是誰看來看去看理會不得處如一團火頓在胸中久久提究到豁然貫通處方知生死二字決定與自己不相干涉示衆今時學道人多是腳跟不穩立志不堅於世事上不如意則火急要參禪要修行忽然世事稍有如意則不參禪不修行矣此何以故無決定信故也如是學道欲與佛祖把手共行無有是理示衆世尊在靈山會上拈花示衆惟迦葉頭陀破顏微笑且道迦葉見箇甚麼道理便笑者裏下得一語恰當方許來入老僧之室示衆老僧未讀詩書出言莽鹵待人唯一味鐵釘飯木札羹誰肯下口咬嚼世人都是愛逞神機以資談柄無怪方木圓竅兩不相當矣即世尊為一大事因緣出世間有言下相應者盡是途中受用當機證悟唯得迦葉一人而已阿難將佛四十九年說底記持如瓶貯水毫無滲漏末後又疑問迦葉世尊付金襴袈裟外另傳箇甚麼迦葉答曰倒卻門前剎竿著阿難得迦葉者一轉語始入安樂法門大衆倘具一隻超方眼肯越常流必不空過此生根器珍重示衆心地隨時說菩提果自成事理俱無礙當生即不生可怪汾陽李上座十二時中向佛頭上著糞示衆釋迦未曾出世達磨未曾西來老僧未曾卓錫此山時人人頂門上輝大寶光箇箇腳跟下縱橫十字無有缺少無有休歇奈何日用而不知故君子之道鮮矣何以見得人道中若無此光聞呼即應見物便知揚眉瞬目折旋俯仰迎賓待客穿衣喫飯者是誰天道中若無此光受天福樂變化莊嚴視東忘西瞬目不捨修九次第定者是誰地獄道中若無此光洋銅灌口熱鐵沸心刀山上行劍樹上走忍痛受苦者是誰餓鬼道中若無此光針煙焰火長夜燒然呼求食恆受飢渴者是誰畜生道中若無此光披毛戴角銜鐵負鞍喫草飲水飛躍啼嗥者是誰修羅中若無此光三頭六臂嗔焰然眉或現大身甕彌或現小身潛於藕孔者是誰緣覺道中若無此光知苦斷集慕滅修道求聖法者是誰聲聞道中若無此光坐無為床受寂滅樂神通變化飛騰隱顯者是誰菩薩道中若無此光勤修六度萬行莊嚴無疲勞厭怠者是誰諸佛若無此光成等正覺廣度衆生永無休息者是誰山河大地草木叢林若無此光春生夏長秋收冬藏者是誰故知者道光明物物上彰法法上顯本自具足本自圓成雖然無處不現無不承此恩力只因埋在五陰坑中拋在無事甲裏不知參求不知推究故勞釋迦出世達磨西來作箇教主欲人人向自己腳跟下識取者道光明輝天鑑地耀古騰今不但釋迦達磨出來如是即歷代祖師出來也只如是昔西天國王問波羅提尊者曰我欲作佛不知何者是佛尊者曰見性是佛王曰師見性否尊者曰我見佛性王曰性在何處尊者曰性在作用王曰是何作用我今不見尊者曰今現作用王自不見王曰於我有否尊者曰王若作用無有不是王若不用體亦難見王曰若當用時幾處出現尊者曰若出現時當有其八王曰八處佛性當為我說尊者曰在胎為身處世名人在眼曰見在耳曰聞在鼻辨香在舌談論在手執捉在足運奔遍現俱該法界收攝在一微塵識者知是佛性不識喚作精魂王聞是言心即開悟此是波羅提尊者令西天國王向一切處識取者道光明之樣子也裴相國入寺見壁間畫像問院主云壁間是甚麼主云高僧真儀相國云形儀可觀高僧何在主無語相國云者裏有高僧麼時黃蘗在衆院主云有一上座頗似高僧相國遂舉前話蘗云請問來相國云形儀可觀高僧今在甚麼處蘗召裴休休應諾蘗云在甚麼處裴公於言下領旨此是東上祖師令裴相國向語言色相上識取者道光明之樣子也僧問六祖如何是佛祖云我欲說恐汝不信僧云和尚誠言安敢不信祖云即汝便是僧問鹽官如何是本身盧舍那官云與老僧過淨瓶來僧將淨瓶至官云卻安舊處著僧送還舊處復來詰問官云古佛過去久矣老僧引古證今者些葛藤都是與混沌畫眉虛空安柄還知者道光明麼那吒眼裏虛空碎鐵鑄波斯笑海潮參示衆二時課誦乃漸修之學猶人日用飲食不可無也如參禪以提話頭為務或參父母未生前或參如何是本來面目或參念佛是誰是必二六時中勤參不歇方才契悟自心豈不是一乘圓頓妙法門見性成佛真祕典如念佛以一心不亂專持名號為務行人單以一生長齊不飲酒茹葷廣行布施禮拜供養親善知識受持經典晝夜六時勤切念佛始終如一則臨命終時觀音彌陀親垂接引豈不是臨終西方境分明在目前也今有人披張禪師封皮酒葷不斷自誤誤人其過非小不見永明壽禪師四料揀云有禪無淨土十人九錯路陰境若現前瞥爾隨他去謂只明禪理不習禪定不修六度淨業一生狂亂隨流臨終陰境現前輪回六道者是也二曰無禪有淨土萬修萬人去但得見彌陀何愁不開悟謂見地不明一生只修淨業念佛發願往生廣修萬行臨終仗彌陀願力攝受往生西方決定無疑三曰有禪有淨土猶如戴角虎現前為人師當來作佛祖謂深達佛理兼修淨業隨其根性化人念佛為人天師往生上品四曰無禪無淨土鐵床並銅柱萬劫與千生沒箇人依怙謂不明佛理不修淨業不願往生甘受沉淪何由出離苦海諸仁者欲超生死證菩提宜擇善行之速登上品正恁麼時腰纏十萬貫騎鶴上楊州好不快活法語示扆恆上座者箇道理亙古亙今恆常不變也不著忘懷也不著念慮但自時時參究刻刻提撕妄念起時亦不得止遏止動歸止止更彌動如何敵得生死只就動止處看箇話頭便是釋迦老子達磨大師出來多方為人只是者箇歷代祖師順機接引也只是者箇一問一答賓主交參也只是者箇舉起茶杯放下匙筯也只是者箇老僧恁麼舉似恁麼注解此中還敵得生死也無若謂敵不得生死總是未會者箇落點處既是未會者箇落點處須行也參者箇坐也參者箇喜怒哀樂時也參者箇應用酬酢時也參者箇參來參去參到沒滋味沒撈摸處如秋月懸空毫無雲彩心頭熱悶悶地恰如一盤火相似便是參究得力處不可放捨忽爾洗面摸著鼻孔經行踢著指頭自然心花發明照十方剎一微塵裏轉大法輪且道法輪作麼生轉請過別峰頭上與汝相見示真空禪人一念萬年萬年一念亙古亙今恆常不變鼻端凝住白蓮開鐵脊胡床觀自在撲破明鏡解翻騰淨土娑婆成一塊咦還見阿彌陀佛麼喚來與真空洗腳示明德居士昔二祖神光為一代曠達之士博覽群書善談玄理每自嘆曰孔老之教禮術風規莊易之談未盡妙理乃往少林晨夕參請達磨常端坐面壁莫聞誨示光自思惟昔人求道敲骨取髓刺血濟飢布髮掩泥投崖飼虎古尚若此我又何人是夜天雨大雪光堅立不動遲明積雪過膝磨憫而問曰汝久立雪中欲求何事光悲淚曰惟願和尚慈悲開甘露門普濟群品磨曰諸佛無上妙道歷劫精勤難行能行非忍而忍豈以小志小德輕心慢心欲冀真乘必須勤苦光聞誨勵遂自斷臂求之磨再論曰外息諸緣內心無喘心如墻壁可以入道末後為親承入室之真子欲學此道當體此規儀非造次者可登也機緣師問一僧你是那裏人僧云本地師云那裏是汝本地僧云等丘師云者僧眉毛原在額上一僧進方丈師云千佛在甚麼處僧進前磨墨師云我問汝千佛在甚麼處僧又磨墨師云去一僧侍師行次師指黑白二犬云者不是曹洞宗旨僧云那箇是正位師云雞向五更啼師舉古鏡未磨公案驗一喝居士士云某甲則不然若有人問古鏡未磨時如何銅磨後如何非銅師云誰知是兩塊銅問答僧問古人道逢人則不出出則便為人和尚今日將甚麼為人師云虛空頭戴角進云若遇盲聾瘖啞三種人來時如何師云玉兔嚼寒冰僧禮拜師撫禪床云茫茫宇宙人無數那箇男兒是丈夫僧問如何是未生前事師云我不曾與汝同參進云如何是已生後事師云我曾與汝同參進云和尚恁麼得大自在師云我恁麼得大自在僧問一心不異萬法一如如何是萬法之源師云飯鉢子僧看夾山參船子機緣次師云者漢若不是道吾幾乎半途而廢僧云那裏是他半途師指夾山語云者不是僧便問如何是法身師云木魚兩箇口如何是法眼師云香爐三隻腳僧問念佛底是誰師云雞鳴犬吠佛事為聚雲萬祖忌日拈香舉南泉和尚為馬大師設齊問衆云大師來麼有道合取鉢盂有道真堂前更添一分食今日為聚雲設齊也不問來與不來瞞頇大衆但看師翁者十四年來入泥入水葛藤不少不肖炳孫欲搖唇鼓舌稱揚讚嘆又是土上加泥諸昆仲且道師翁說底以何為驗遂拈香禮聚雲萬祖真冤有頭債有主聚雲堂上曾觸忤毒鼓遺來到處鳴戴角泥牛拍掌舞拈香作禮云兒孫得力祖父不知為蘇茂宇居士對靈舉古德云紅芍藥邊方舞蝶碧梧桐裏正啼鶯目前大道無遮障只是時人不解行驀豎拄杖云會麼居士平日建立精藍請佛供養也是者箇護持三寶親近知識也是者箇四十九日以來淨穢不著去來不分也是者箇既是者箇還有出格事也無卓一卓喝一喝為思修禪人舉火拈火炬上下指云還見麼上是天下是地四方八面無回避鐵牛咬碎破沙盆思修頓入三摩地為心池維那舉火清淨行者不入涅槃破戒比丘不入地獄秪如心池維那不是清淨行者亦非破戒比丘又向甚麼處安置擊火炬云法筵龍象衆當觀第一義為崑山行者舉火以火炬敲龕左邊云君子道長敲龕右邊云小人道消年月日時俱吉利節候到此不相饒還知不相饒處麼東鄰鐵馬鼻繩斷沒處藏身著火燒題讚讚吹萬師翁者慈尊一箇好潔白人不做無端去朝陽洞飲真空水來聚雲堂上吐甘露泉引得後代兒孫一箇箇粧風賣顛逢場作戲仔細檢點者不唧溜底老凍儂好將一條斷貫索穿著鼻孔送在無佛處稱尊若論仁義道中且燒一瓣兜樂婆畢力迦沉水香留作人天供養達磨渡江紙上水上海上江上無住為宗竺乾震旦面壁處一味直指單傳付囑時兩卷楞伽教相得恁麼賣弄精魂笑殺衡山和尚隻履西歸無端自西來禍胎從此起不是斷臂人幾乎坐殺你咦者回歸去勿再來再來失卻那隻履瑞林畫達磨請題瓶內有花紙上有相石上有松且道達磨面目在甚麼處咄會得許你動手自讚三腳驢子弄蹄行天上天下沒蹤跡威音已前威音後沒量人騎沒量驢此是老僧重下底注解就裏有二句是玄要料揀有二句是賓主照用若檢點得出與老僧把手共行如或未然且向第二頭薦取偈頌頌臺山公案古道傍邊老牸牛頭生雙角使人愁趙州握口無鋒劍劄盡浮雲萬戶收頌末後句末後句隔一層無端錯認定盤星手長衫袖短風逐水成文凌煙閣上功臣杳說向愁人愁殺人頌國師三喚侍者一箇銅睛鐵眼一箇鐵眼銅睛兩箇暗中書字不覺偶爾成文頌國師問紫璘童子全章供奉童子草作黃色要識一貫兩個五百頌曹源一滴水問在答處答在問處問答分明燈籠露柱別峰上座係忠郡孝廉其子亦食饌俱從慶忠老人祝髮時住風木臺賦寄風木臺無風木傷竿頭進步共商量商量極處見題目悟我木樨越桂香示竹庵靜主且住庵中且住僧急須策杖別峰行他時行到無行處始信吉祥正眼青書問上慶忠老人弟子久擬出江隨侍巾瓶第火鏡太明芒鞋生澀雖承事不以寒暑為勞奈吾師之家富養子多驕特走執事持供不腆暫調香積俟布金主人將祗園大定並候法旨方敢束裝臨啓惶懼寄映曹勤舊龐居士云有男不婚有女不嫁大家團圞頭共說無生話後元豐間有箇無為居士曾參宗門大有所得和龐公偈曰男大須婚女大須嫁討甚閒工夫更說無生話者兩箇俗士將十方常住分疆列界各自稱尊彼時有箇海印信禪師因見無為居士此偈亦作偈曰我無男婚亦無女嫁困來便打眠誰管無生話過此三大士再無與渠把手共行者聞勤舊女已嫁矣想于青州布衫公案用力參究山僧代作一偈儻日後打穿漆桶與三大士把手共行不負歷年護法之誠偈曰我雖無男婚卻也有女嫁從此究根源再不說閒話看者一偈與三大士是同耶是別耶若道同幻人心識本來無若道別罪福皆空無所住或曰此是月山參底話頭因甚書與勤舊我直向他道嘉州大象喫黃連陝府鐵牛滿口苦說到者裏不覺一場大笑姑且截斷葛藤復汾陽覺師弟兀坐山中無可共話忽讀華札並十二時歌不覺抖擻精神通身踊躍想吾弟做將軍時金戈鐵馬躍武揚威未足為貴今日在糞草堆中拾得無價之寶照天照地布施無窮方為貴耳賢弟莫謂年邁無為正宜老當益壯他日聲教過汾利益不同小小至若聚雲掃塔之行帚柄原在衡山手中亦任那腳跟穩與未穩者隨侍函丈去來俟秋末冬初將老聚雲多寶全身和盤托出江上一個個不可謂衡山得恁麼不惜眉毛一笑又莊讀來翰知吾弟氣概不同法門甚幸但門庭施設不可不捷疾操履入理深談不可不確細討論拿者兩條路參證明白縛作一束送在永安沱裏然後向寶花座上提持入泥入水或上或下只教獅子迷蹤誰奈你何若不如是笑破天下人舌頭在復友人吉祥久欲出江第以暑氣逼人實難舉足聚雲之行吉祥多子塔中往來遊戲夜夜同眠朝朝共起何必區區鼓棹臨江耶或曰理上則可事上不然我向他道離卻理事來與吉祥相見答慈庵靜主春初一別不覺經秋忽接雲章恍如覿面每嘆賢座天資不群住山清白儻肯放下狂心一味參究則世出世間事自然通天達地耀古騰今那許倚墻靠壁討人冷暖耶吉祥日用本分為人若將油鹽醬酢五味調和接待往來諸方定罵我去在儻不惜草鞋過山一晤冬瓜茄子亦任飽餐必不空出寄寶善居士古德云頓明自性與佛同儔然有無始染習必假漸修令人順性起用如人喫飯那能一口便飽圭峰和尚答溫造尚書曰真理雖然頓達此情難以卒除如風頓止波浪暫停豈可一生所修便同佛用又云作有義事是惺悟心作無義事是狂亂心狂亂隨情念臨終被業牽惺悟不由情臨終能轉業庵提遮女問文殊云明知生是不生之理因甚為生死之所流轉殊云其力未充雖有見性不留佛悟道不存師目睹瞿曇猶如黃蘗一大藏教是老僧坐具祖師玄旨是破草鞋寧可赤腳不穿者個說話另具一番眼孔始得所以白居易侍郎問惟寬和尚曰禪師何以說法寬曰無上菩提心戒備於身為律說於口為法行於心為禪應用者三其致一也易曰既無分別何以修心寬曰心本無損傷云何要修理易曰無修無著又何異凡夫寬曰凡夫無明二乘執著除此二病是曰真修真修者亦非勤亦非忘勤則近執著忘則落無明是為真修心要古宿入法淵微示人剋底若此昔大安三十年只看得一頭水牯牛趙州以粥飯二時為錯用心處此昔後世行履之模範也如雲門大師是法海神龍出語萬古不墮常流一日上堂問僧曰世界恁麼闊為甚鐘聲披七條僧曰不會門云七里灘頭多蛤子今人只知他老作家手段不知他參學之苦初行腳到乾峰峰示衆云法身有三種病二種光須是一一透得更須知有向上一竅門云只如庵內人為甚不知庵外事峰呵呵大笑門云猶是某甲疑處峰云你是甚麼心行門云也要和尚相委悉峰云直須恁麼始得穩坐地門云諾諾到曹山山示衆云諸方盡把格則何不與他道卻令他不疑去門出衆云密密處為甚麼不知有山云秪為密密所以不知有門云此人如何親近山云莫向密密處親近門云不向密密處親近時如何山云始解親近門云諾諾後到疏山山上堂云病僧咸通年前會得法身邊事咸通年後會得法身向上事門出衆云如何是法身邊事山云枯樁門云如何是法身向上事山云非枯樁門云還許學人說道理也無山云許門云和尚道枯樁豈不是法身邊事山云是門云道非枯樁豈不是法身向上事山云是門云秪如法身還該一切法也無山云法身周遍豈得不該門指淨瓶云秪如淨瓶還該法身也無山云闍黎莫向淨瓶邊覓門遂禮拜只者幾段機緣一一透得證得始可向高高山頂立深深海底行也居士乘悲願力現將軍身到法門中來摸著衲僧鼻孔俟出得門時另有一番說話且道說甚麼話機絲不挂梭頭事文彩縱橫意自殊四川石砫普賢庵戒弟子性印性果性通海明海澄海清海覺助刻衡山老和尚語録一卷祈求早明般若正因永證菩提妙果附塔銘高峰法侄性統撰粵自西乾釋迦文佛開教以來祖祖傳心得人道顯所由來矣逮夫西旨東流宗分五派臨濟而下于我先世大慧宗杲禪師稱益盛焉杲傳懶庵需需傳鼓山永永傳淨慈明明傳苦口益益傳筏渡慈慈傳一言顯顯傳小庵密密傳二仰欽欽傳無念有有傳荊山寶寶傳鐵牛遠遠傳月明池池傳吹萬真真傳鐵壁機機付法一十八人高峰先師其第四也第三座則為衡山燈炳禪師初號沖谷本蜀南道瀘州合江縣馮氏子世業儒師生有異相既長不樂世典遂祝髮焉初習教乘久之嘆曰黃葉雖可止啼幾誤卻出世嬰兒乃治任東下遍訪名宿過萬邑興隆寺進叩吹萬老人痛遭鉗錘不覺渾身俱碎隨老人遷忠之聚雲執侍者事脅不就席者數年老人告寂鐵師翁繼席師以事老人者事之猛醒奮發于翁拄杖頭邊搗穿漆桶翁印以偈則在辛卯六月望前五日也出住石司之香爐寺數年性孤淡不樂與世交而真俗從之者愈衆忠屬范村有族業一所延師卓錫焉勉請乃就是時狼煙四起林密人稀師闢棘插草不為懼緇衲雲集無怨勞者凡夫武夫健將皆倒旌門下嗚呼是非有以大服其心而能然平剎成匾其額曰慶雲正我朝鼎興平治之年皇風浩蕩關津無阻師遠涉萬里掃大慧祖塔于浙之雙徑望其五峰聳翠殿閣依然而法席終虛萬種感發一載復歸維時統方祝髮師見而異之曰中興雙徑其在此子矣統尚孩孺亦未知其言之重也自是朝夕相見從不作世情一語每嘆祖道艱危法門秋晚諄諄齒頰間俱示相囑之意庚申春值兵變統隨先師避地禮別于師師垂涕曰吾老矣于世何濟亂離若此何心人世哉揖而囑統曰法道惟賢座是賴願勿忘我相送竹堵門耿耿然由由然屢顧後別別且遠悲聲尚在耳也孰知離不幾時走訃者至嗚呼愈知師別時相囑之言誠有心矣師生于萬曆辛亥四月十一日子時于庚申六月十八日沐浴端坐訓衆畢說偈而逝世壽七十僧臘五十三語録一卷行世闍維後師得法弟子性玨奉師靈骨附葬于高峰祖塔內承先師命也蓋高峰祖塔先師修以安鐵師翁者左右附二井以左井迎師右井先師以之自待焉殆以父子兄弟誼篤一堂示遺範于來茲耳玨念慶雲為師開創將靈骨留半欲建塔以主叢林無如事未就而玨古矣其徒若孫不忘先志謀為合塔以安兩代誠亦孝思之不誼也統思之悼之用是激切感仰而為之銘曰我宗的旨教外別傳人人本具證自西乾臊胡遺臭迄平中土作獅子兒大慧為最遞傳而下代有明宗獨師荷任志願堅隆語傾甘露氣靄慈雲披肝瀝膽倣佛難名追思莫盡緬維德音渺渺豫懷將于斯銘斯名在列皎月當天清輝不改普照永年
